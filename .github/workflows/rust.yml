name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Configure git identity
      run: |
        git config --global user.name "Harness CI"
        git config --global user.email "ci@androidharness.local"
    - name: Build debug
      run: cargo build --verbose
    - name: Run tests
      run: |
        cargo test -- --nocapture > test.log 2>&1 || {
          ERR=$(grep -C 4 -E "(FAILED|panicked at)" test.log | head -n 30 | tr '\n' '; ')
          echo "::error title=Test Failure::$ERR"
          exit 1
        }
    - name: Summarize failure
      if: failure()
      run: |
        echo "### Cargo Test Failures" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat test.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - name: Upload debug binary
      uses: actions/upload-artifact@v4
      with:
        name: harness-debug-linux-x86_64
        path: target/debug/harness
      if: always()
